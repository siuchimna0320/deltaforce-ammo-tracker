name: Delta Force Ammo Scraper

on:
  workflow_dispatch:

concurrency:
  group: ammo-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read            

    steps:
      # 1. 下載儲存庫
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 2. 連線 Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 3. 列出目前執行中的 Workflow
      - name: Check in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow="${{ github.workflow }}" --status=in_progress

      # 4. 設定 Python 環境（已移除快取設定）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 5. 安裝所需的 Python 套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas psycopg2-binary sqlalchemy

      # 6. 執行爬蟲腳本（內建重試）
      - name: Run scraper with retry
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            python scraper.py && break
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done

      # 7. 寫入 PostgreSQL
      - name: Write data to PostgreSQL
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: python csv_to_db.py

      # 8. 自動 Commit & Push
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ammo_prices_wide.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ammo prices - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
