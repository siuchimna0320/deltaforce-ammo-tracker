name: Delta Force Ammo Scraper

on:
  workflow_dispatch:

concurrency:
  group: ammo-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read            

    steps:
      # 1. 使用標準 Checkout Action 下載儲存庫（比手動 git clone 穩定且不易出錯）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 2. 連線 Tailscale（使用 OAuth Client 認證）
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:github-runner

      # 3. 列出目前執行中的 Workflow（可選）
      - name: Check in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow="${{ github.workflow }}" --status=in_progress

      # 4. 設定 Python 環境（使用官方 Action，支援 pip 快取且乾淨）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 5. 安裝所需的 Python 套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas psycopg2-binary sqlalchemy

      # 6. 執行爬蟲腳本（內建失敗重試機制）
      - name: Run scraper with retry
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            python scraper.py && break
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done

      # 7. 透過 Tailscale 內網將數據寫入 PostgreSQL
      - name: Write data to PostgreSQL
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
        run: python csv_to_db.py

      # 8. 檢查 CSV 是否有變更並自動 Commit & Push 回 Repo
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ammo_prices_wide.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ammo prices - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
